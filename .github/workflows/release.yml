name: Release

# 推 v* 标签时自动构建并发布；也可以在 Actions 页面手动触发
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag，例如 v1.0.0'
        required: true

# 发布 Release 需要写仓库内容的权限
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 自己装 SDK，不依赖 setup-android 那个 action
      - name: 安装 Android SDK 组件
        run: |
          set -e
          SDKMANAGER="$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "runner 上没有 sdkmanager，改为手工下载命令行工具"
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            cd /tmp
            curl -sSL -o cmdtools.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "使用 $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;34.0.0"
          ls "$ANDROID_HOME/build-tools"

      - name: 构建 APK
        run: |
          chmod +x build.sh
          ./build.sh

      - name: 生成校验和
        run: |
          cp bingbot.apk "bing-rewards-bot-${GITHUB_REF_NAME}.apk"
          sha256sum "bing-rewards-bot-${GITHUB_REF_NAME}.apk" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: 创建 Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if [ -f RELEASE_NOTES.md ]; then
            gh release create "$TAG" \
              --title "Bing 积分助手 $TAG" \
              --notes-file RELEASE_NOTES.md \
              "bing-rewards-bot-${TAG}.apk" \
              SHA256SUMS.txt
          else
            gh release create "$TAG" \
              --title "Bing 积分助手 $TAG" \
              --generate-notes \
              "bing-rewards-bot-${TAG}.apk" \
              SHA256SUMS.txt
          fi
